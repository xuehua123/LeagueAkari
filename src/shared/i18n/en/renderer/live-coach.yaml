    openPrivacy: Open Privacy & Data Controls
    replayTitle: Learn the output with an offline replay
    replayDescription: Reviews provides a clearly labeled sample and local recording import. Simulated results are never presented as a live match.
    openReplay: Open Tactical Reviews
    consentTitle: Review the summary before confirming
    consentDescription: Choosing Live Coach authorizes only the on-device real-time processing described here. Choosing offline analysis does not enable real-time screen capture. You can go back to make changes or continue skipped checks later.
