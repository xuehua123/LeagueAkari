      privacy:
        title: 如何撤回、导出或删除数据
        description: 撤回实时授权会先关闭实时教练，但不会自动删除既有本机数据；删除会清理反馈、提示、计时、沟通记录、验收证据、离线复盘历史与内部结果，以及手动标定，不会删除源录像、Sidecar 或另存的导出文件。
        action: 打开隐私与授权
      unsupported:
        title: 当前环境不受支持
        description: 一期实时能力仅面向 Windows 10/11、召唤师峡谷和窗口化或无边框模式，并受地区、队列、补丁与能力开关限制。离线复盘仍可独立使用。
