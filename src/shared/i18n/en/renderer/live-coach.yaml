  privacy:
    title: Privacy & Data Policy
    localComputeTitle: 100% Local Computation
    localComputeDesc: All coach processing stays on this device. Minimap vision runs in an isolated child process, and raw game frames are never uploaded. Phase 1 requests no microphone permission and does not listen to team voice or system audio.
    noAntiCheatTitle: Anti-Cheat Compliance
    noAntiCheatDesc: Uses only Riot Live Client Data (port 2999) and screen capture, without reading game memory, injecting code, or controlling the game process. Public release remains subject to Riot review and remote capability controls.
    dataScopeTitle: How each local data category is used
    screenDataTitle: Game-window frames
    screenDataDesc: Read only during real-time capture or a preview you request. Full frames are not persisted or uploaded by default, and previews are cleared from the page automatically.
    roiDataTitle: Minimap ROI
    roiDataDesc: Only minimap-region pixels are passed to the isolated worker. Manual outline coordinates stay on this device and are removed by reset or local-data deletion.
    structuredDataTitle: Structured match data
    structuredDataDesc: Riot local Live Data, cues, timers, confirmed communication, and feedback are used only for coach output, reviews, and local Phase 1 acceptance evidence.
    diagnosticsDataTitle: Diagnostics
    diagnosticsDataDesc: Environment, capability, performance, and error codes support local troubleshooting. They are written to a report only when you export it, with raw frames, full paths, and summoner names excluded by default.
    dataImprovementTitle: Data-improvement sharing is not available
    dataImprovementDesc: This build has no upload channel for anonymous metrics, diagnostics logs, or minimap samples, so every sharing category remains off. Local export is user-initiated and is never sent automatically.
    consentTitle: Real-time Processing Consent
    consentGranted: Confirmed
    consentWithdrawn: Not Confirmed
    consentGrantedDesc: This consent covers only the on-device real-time processing described here, not data-improvement uploads. You can review the guide or withdraw consent to stop the current and future live sessions at any time.
    consentWithdrawnDesc: Live Coach remains disabled. The built-in demo stays available, but importing a local replay requires confirming the current privacy notice again. Withdrawing consent does not automatically delete existing local data.
    reviewGuide: Review First-use Guide
    withdrawConsent: Withdraw & Review Again
    withdrawConsentConfirm: Live Coach will be disabled and the current session ended before consent is withdrawn. Existing local data will not be deleted. Continue?
    withdrawConsentDone: Real-time processing consent withdrawn and Live Coach disabled.
    withdrawConsentFailed: Unable to fully withdraw real-time processing consent.
    localDataTitle: Local Coach Data
    localDataDesc: Cue feedback is retained for up to 180 days. Exports contain the current structured session, recent cues, timers, confirmed communication, feedback, manual calibration, Phase 1 acceptance evidence, and privacy-filtered replay tasks and results—never raw frames, source video, full source paths, or microphone audio. Deletion does not reset coach preferences or consent and cannot remove source recordings, sidecars, or exports saved elsewhere.
    export: Export Local Coach Data
    delete: Delete Local Coach Data
    deleteConfirm: This ends the current coach session and deletes local feedback, current and recent cues, timers, communication history, Phase 1 acceptance evidence, offline review history and internal results/temporary content, and manual calibration. It does not delete source recordings, sidecars, saved exports, coach preferences, or consent. Continue?
    exported: Local coach data exported.
    exportFailed: Unable to export local coach data.
    deleted: Local coach data deleted.
    deleteFailed: Unable to fully delete local coach data.
