        action: 查看运行诊断
      replay:
        title: 离线录像支持什么格式
        description: 支持项目结构化 JSON，以及 MP4、MKV、WebM 录像；不直接读取原生 .rofl。可把同名 .sidecar.json 放在录像旁补充结构化事件。
