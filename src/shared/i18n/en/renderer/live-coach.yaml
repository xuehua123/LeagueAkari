  help:
    title: Help & Quick Start
    phaseTitle: Prepare before entering a live match
    phaseDescription: This page provides the recommended setup order and troubleshooting entry points. Diagnostics and the current capability state are authoritative; opening Help does not mean the environment passed.
    steps:
      environment:
        title: 1. Check the environment
        description: Check capture, local voices, and shortcut support, then test game-window capture once you are in a match.
        action: Open Diagnostics
      calibration:
        title: 2. Confirm the minimap region
        description: Request a one-time preview and confirm the outline covers the full minimap. Adjust and save it when confidence is insufficient.
        action: Open Calibration
      controls:
        title: 3. Configure in-game controls
        description: Configure pause, mute, repeat, recalibration, and overlay shortcuts, then choose subtitle, sound, or speech output.
        action: Open Coach Settings
      replay:
        title: 4. Try an offline review first
        description: Load the clearly labeled sample or import a local JSON, MP4, MKV, or WebM file to learn the timeline and cue states.
        action: Open Tactical Reviews
      privacy:
        title: 5. Review the data boundaries
        description: See how frames, minimap ROI, structured data, and diagnostics are handled, plus the exact scope of withdrawal, export, and deletion.
        action: Open Privacy
    boundariesTitle: Keep these boundaries in mind
    boundaryObservation: Currently visible minimap content is directly observed. Fog regions, routes, and intent are time-limited probability estimates.
    boundaryControl: The coach never clicks, buys, casts, or sends game input automatically. Communication phrases still require confirmation and manual paste.
    boundaryReplay: Samples and offline analyses are always labeled as examples or reviews and never represent the current live match.
    boundaryPrivacy: Phase 1 requests no microphone permission and does not listen to team voice or system audio. Full game frames are not persisted or uploaded by default.
    topicsTitle: Tutorials & Troubleshooting
    topics:
      gettingStarted:
        title: Reopen the first-use tutorial
        description: Choose offline or live use again and review capabilities, support limits, preparation steps, and the final summary. Reviewing an existing consent does not automatically change the main switch.
        action: Open First-use Guide
      calibration:
        title: The minimap region is incorrect
        description: Enter Summoner's Rift in windowed or borderless mode, confirm the in-game minimap side, and request one preview. Adjust and save the outline if it is incomplete or low-confidence.
        action: Open Calibration
      capture:
        title: Game-window capture is missing, black, or stalled
        description: Keep the League game window open on the same Windows desktop, use windowed or borderless mode, and rerun the full environment check. A one-time preview does not prove that a real-time WGC/DDA backend is available.
        action: Check Capture Again
      permission:
        title: Screen capture permission is unavailable
        description: Allow League Akari to capture the game window in Windows privacy or security controls, then restart the app and rerun the full environment check. No permission result is treated as a pass.
        action: Recheck Permission
      patch:
        title: The current game patch is unknown or unsupported
        description: Update League and League Akari, enter a supported match so the patch can be detected, and inspect the capability reason again. Do not force real-time coaching while the patch gate is closed.
        action: Inspect Patch Status
      platform:
        title: Platform or native runtime is unsupported
        description: Phase 1 real-time capture and native shortcuts require a supported Windows build and working native runtime. Offline review remains available when the real-time platform gate is closed.
        action: Inspect Platform Status
      consent:
        title: Real-time processing consent is missing or outdated
        description: Review the current privacy notice and processing purposes in Privacy, then explicitly confirm the current consent version. Opening Help or completing environment checks never grants consent.
        action: Review Privacy & Consent
      liveData:
        title: Live Client Data is unavailable
        description: Keep the League game and client running, wait for the in-game Live Client Data endpoint to become healthy, and rerun Diagnostics. Map-space conclusions still require healthy minimap evidence.
        action: Inspect Live Data
      noSound:
        title: No alert sound or speech
        description: Confirm the output channels include Sound or Speech, the coach is not muted, local speech is enabled, and a working output device is selected. Then run the TTS test.
        action: Check Voice Settings
      overlay:
        title: Overlay subtitles are not visible
        description: Confirm Subtitle output and the overlay are enabled, with visible opacity. To reposition it, unlock the overlay and use its adjustment shortcut.
        action: Check Coach Settings
      automaticPause:
        title: Why the coach paused automatically
        description: Unsupported map, queue, region, or patch; a missing, black, or stalled capture; uncalibrated or occluded ROI; and interrupted Live Data can pause or degrade the coach. Diagnostics shows the current reason code.
        action: Open Diagnostics
      replay:
        title: Supported offline replay formats
        description: Project structured JSON and MP4, MKV, or WebM recordings are supported; native .rofl is not. Place an optional same-name .sidecar.json beside a video to supply structured events.
        action: Open Tactical Reviews
      privacy:
        title: Withdraw, export, or delete data
        description: Withdrawing real-time consent first disables Live Coach but does not delete existing local data. Deletion clears feedback, cues, timers, communication history, acceptance evidence, privacy-filtered replay history and internal results, and manual calibration—not source recordings, sidecars, or saved exports.
        action: Open Privacy
      unsupported:
        title: The current environment is unsupported
        description: Phase 1 real-time support targets Windows 10/11, Summoner's Rift, and windowed or borderless mode, subject to region, queue, patch, and capability gates. Offline reviews remain independent.
        action: Inspect the Reason
      reportIssue:
        title: Information needed to report an issue
        description: Generate a privacy-safe diagnostics report and provide it manually through the project's existing support channel. It excludes raw frames, recordings, full paths, summoner names, custom communication text, and tokens; this page never uploads it automatically.
        action: Generate Diagnostics Report
    openGuide: Reopen First-use Guide
    backToOverview: Back to Overview
