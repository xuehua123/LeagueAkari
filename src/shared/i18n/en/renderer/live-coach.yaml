  onboarding:
    title: Enable Live AI Coach
    steps:
      scope: Choose a Path
      environment: Prepare
      prepare: Controls & Data
      consent: Review
    scopeTitle: Understand the capability boundaries first
    capabilities: The feature reads Riot's local Live Client Data and analyzes only the minimap region of the current game window to provide real-time subtitles, sounds, speech, and deterministic guidance.
    support: Phase 1 supports Windows 10/11, Summoner's Rift, and windowed or borderless mode. Dependent output stops in unsupported environments.
    privacy: Raw frames are neither uploaded nor persisted by default, and microphone permission is not requested. Structured feedback stays local and can be exported, withdrawn, or deleted.
    risk: Fog positions, routes, and intent are probability estimates—not directly observed facts. The coach should remain silent or retract a cue when confidence is low or evidence expires.
    controls: Configure pause, mute, recalibration, and overlay adjustment shortcuts in Settings so the coach remains controllable during a match.
    test: Run the environment, TTS, and game capture checks in Diagnostics before your first match.
    pathTitle: Where would you like to start?
    pathRealtime: Live Coach
    pathOffline: Offline Video Analysis
    pathRealtimeDesc: Check this device, minimap position, output, and in-game controls. Real-time processing starts only after your final confirmation.
    pathOfflineDesc: Analyze a local structured JSON replay or MP4, MKV, or WebM recording without enabling real-time screen capture.
    environmentTitle: Environment and output checks
    environmentDescription: Check the Windows capture backend, local voices, and shortcut support, then test TTS and game-window capture separately.
    openDiagnostics: Open Diagnostics
    calibrationTitle: Check the minimap position
    calibrationDescription: Enter a match and request one preview. Confirm that the outline covers the complete minimap; the preview clears after 10 seconds.
    openCalibration: Open Calibration
    offlineTitle: Offline analysis does not require Live Coach
    offlineDescription: Native .rofl files cannot be imported directly. Use structured JSON or prepare an MP4, MKV, or WebM recording. Without a sidecar, only minimap capabilities run.
