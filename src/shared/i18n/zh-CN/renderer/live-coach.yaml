  onboarding:
    title: 开启实时 AI 教练（一次确认）
    steps:
      scope: 使用方式
      environment: 准备环境
      prepare: 控制与数据
      consent: 确认摘要
    scopeTitle: 先了解能力边界
    capabilities: 功能会读取本机 Riot 官方 Live Client Data，并只分析当前游戏窗口中的小地图区域，用于实时字幕、提示音、语音和确定性建议。
    support: 首期支持 Windows 10/11、召唤师峡谷自定义、训练、匹配和排位对局，以及窗口化或无边框模式；不支持时会停止相关输出。
    customSupportTitle: 支持自定义对局和训练模式
    customSupportDescription: 确认后不需要继续配置。直接进入召唤师峡谷自定义或训练对局，游戏开始时 AI 教练会自动启动。
    voiceDefault: 默认启用悬浮字幕和本地短语音；无需麦克风，也不会上传游戏画面，之后可随时一键静音或关闭语音。
    privacy: 默认不上传或落盘原始画面，不申请麦克风权限；结构化反馈保存在本机且可导出、撤销和删除。
    risk: 迷雾位置、路线和意图属于概率预测，不是直接看到的事实；低置信度或证据失效时系统应保持安静或撤销提示。
    controls: 请在“提醒策略”页设置暂停、静音、重新标定和悬浮窗调整快捷键，避免对局中无法快速控制。
    test: 建议先在“运行诊断”页完成环境、TTS 和游戏采集测试。
    pathTitle: 第一次想从哪里开始？
    pathRealtime: 实时教练
    pathOffline: 离线录像分析
    pathRealtimeDesc: 继续检查本机环境、小地图位置、输出和局内控制；最后确认后才启用实时处理。
    pathOfflineDesc: 直接分析本机结构化 JSON 或 MP4、MKV、WebM 录像，不会启用实时屏幕采集。
    environmentTitle: 环境与输出检查
    environmentDescription: 检查 Windows 采集后端、本地音色、快捷键支持，并可分别测试 TTS 和游戏窗口采集。
    openDiagnostics: 打开运行诊断
    calibrationTitle: 小地图位置检查
    calibrationDescription: 进入对局后请求一次预览，确认系统框选的是完整小地图；预览会在 10 秒后清除。
    openCalibration: 打开小地图标定
    offlineTitle: 离线分析无需启用实时教练
    offlineDescription: 原生 .rofl 文件不能直接导入。请使用结构化 JSON，或先准备 MP4、MKV、WebM 录像；缺少 Sidecar 时只执行小地图能力。
    controlsTitle: 局内控制与试听
    openControls: 设置快捷键与输出
    testSpeech: 试听当前本地语音
    privacyTitle: 数据范围与撤回
    openPrivacy: 查看隐私与数据控制
    replayTitle: 先用离线回放熟悉输出
    replayDescription: 回放页提供明确标记的标准演示，也支持导入本机录像；模拟结果不会冒充真实对局。
    openReplay: 打开战术复盘
    consentTitle: 检查摘要后再确认
    consentDescription: 确认后会启用当前说明中的本机实时处理；可随时关闭总开关或在“隐私与授权”中撤回。
    summaryPath: 首次使用方式
    summaryCalibration: 当前小地图状态
    summaryOutput: 当前输出方式
    summaryShortcuts: 暂停、静音、重标定快捷键
    summaryShortcutCount: 已设置 {{count}} / 3 项
    summaryNone: 未启用输出
    reopenHint: 以后可从“帮助与快速上手”重新查看本向导，或在“隐私与授权”撤回实时处理授权。
    acknowledge: 我已了解支持范围、隐私处理、预测不确定性和关闭方式。
    cancel: 暂不启用
    previous: 上一步
    next: 下一步
    enable: 确认并启用
    enabledSuccess: AI 教练已开启，直接进入召唤师峡谷自定义或训练对局即可。
    done: 完成查看
    startOffline: 前往离线分析
  help:
    title: 帮助与快速上手
    phaseTitle: 先完成准备，再进入真实对局
    phaseDescription: 本页提供准备顺序和故障排查入口；是否真正可用以“运行诊断”和当前能力状态为准，打开帮助本身不代表环境已经通过。
    steps:
      environment:
        title: 1. 检查运行环境
        description: 检查采集后端、本地音色和快捷键支持；进入对局后再测试一次游戏窗口采集。
        action: 打开运行诊断
      calibration:
        title: 2. 确认小地图区域
        description: 请求一次性预览，确认框线完整覆盖小地图；置信度不足时手动调整并保存。
        action: 打开小地图标定
      controls:
        title: 3. 设置局内控制
        description: 配置暂停、静音、重复提示、重新标定和悬浮窗调整快捷键，并选择字幕、声音或语音输出。
        action: 打开提醒策略
      replay:
        title: 4. 先体验离线复盘
        description: 加载明确标记的标准演示，或导入本机 JSON、MP4、MKV、WebM 文件熟悉时间线和提示状态。
        action: 打开战术复盘
      privacy:
        title: 5. 查看数据边界
        description: 查看画面、小地图 ROI、结构化数据和诊断信息如何处理，并了解授权撤回、导出和删除的实际范围。
        action: 打开隐私与授权
    boundariesTitle: 使用时记住这些边界
    boundaryObservation: 小地图当前可见内容是直接观测；迷雾区域、路线和意图只是带有效期的概率推断。
    boundaryControl: 教练不会点击、购买、施法或自动向游戏发送输入；沟通短语也需要你逐次确认并自行粘贴。
    boundaryReplay: 标准演示和离线分析始终是示例或复盘，不代表当前真实对局状态。
    boundaryPrivacy: 一期不申请麦克风权限，也不监听队伍语音或系统声音；默认不保存、上传完整游戏画面。
    topicsTitle: 教程与故障排查
    topics:
      gettingStarted:
        title: 重新查看首次使用教程
        description: 重新选择离线或实时路径，并回顾能力、支持范围、准备步骤与确认摘要。查看已完成授权时不会自动改变总开关。
        action: 打开首次使用向导
      calibration:
        title: 小地图定位不准
        description: 使用窗口化或无边框模式进入召唤师峡谷，确认游戏内小地图左右位置，再请求一次预览。框线不完整或置信度不足时手动调整并保存。
        action: 前往标定
      capture:
        title: 游戏窗口未找到、黑屏或采集停滞
        description: 保持英雄联盟游戏窗口位于当前 Windows 桌面，使用窗口化或无边框模式，然后重跑完整环境检查。一次性预览成功不代表实时 WGC/DDA 后端已经可用。
        action: 重新检查采集
      permission:
        title: 屏幕采集权限不可用
        description: 在 Windows 隐私或安全设置中允许 League Akari 采集游戏窗口，随后重启应用并重跑完整环境检查。无法获得权限结果时不会记为通过。
        action: 重新检查权限
      patch:
        title: 当前游戏补丁未知或不受支持
        description: 更新英雄联盟与 League Akari，进入受支持对局以读取补丁，再查看能力门禁原因。补丁门禁关闭时不要强行启用实时教练。
        action: 检查补丁状态
      platform:
        title: 平台或原生运行时不受支持
        description: 一期实时采集和原生快捷键要求受支持的 Windows 构建及正常的原生运行时。实时平台门禁关闭时仍可使用离线复盘。
        action: 检查平台状态
      consent:
        title: 实时处理授权缺失或已过期
        description: 在“隐私与授权”查看当前隐私说明和处理用途，再明确确认当前授权版本。打开帮助或完成环境检查都不会自动授予授权。
        action: 查看隐私与授权
      liveData:
        title: Live Client Data 不可用
