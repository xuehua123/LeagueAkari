      fixes:
        restartApp: Restart League Akari; if the state remains unknown, use offline review and export a diagnostics report.
        useWindows: Use the supported Windows build for real-time coaching, or continue with offline review.
        rerunCheck: Rerun the failed item. If it still fails, keep real-time coaching disabled and export a diagnostics report.
        grantCapturePermission: Grant local screen-capture permission, restart the app, and rerun the check.
        verifyCaptureInGame: Confirm the current privacy notice and enter a supported match. Permission is confirmed only while WGC or DDA is actually running.
        installNativeCapture: Repair or reinstall the Windows native runtime; the desktop preview is diagnostic-only.
        useSupportedCaptureEnvironment: Use a supported Windows game-window environment or switch to offline review.
        enterGameAndRerun: Enter a supported match, keep the game window visible, then rerun the failed items.
        useSupportedResolution: Switch the game/display to 1920×1080 or 2560×1440 before calibration.
        useSupportedDpi: Use Windows display scaling from 100% to 150%, then recalibrate.
        preferSdr: Use SDR for Phase 1 release validation; HDR remains partially verified.
        confirmSdrManually: Confirm Windows HDR is off before real-time coaching; this build cannot verify that setting automatically.
        disableHdr: Disable HDR before starting real-time coaching.
        useWindowedOrBorderless: Select windowed or borderless mode in League, then rerun capture and calibration.
        manualCalibration: Open Calibration, inspect the preview, and save a manual ROI only when it covers the full minimap.
        rerunCalibration: Keep the minimap visible and rerun calibration; pause map guidance until it is healthy.
        enterGameAndCalibrate: Enter a supported match and complete one-time minimap calibration.
        useSummonersRift: Use a supported Summoner's Rift queue, or analyze the match offline.
        enterSupportedGame: Enter a supported match and let the client report the map and queue.
        useSupportedQueue: Change to a queue allowed by the current capability policy, or use offline review.
        useSupportedRegionOrOffline: Use an enabled region or continue with offline review; do not bypass the region gate.
        waitForRegionGate: Enter a match and inspect any explicit region reason; this renderer cannot independently confirm region policy.
        updateAndWaitForPatch: Update League and League Akari, then wait for the current patch capability to be enabled.
        enterGameForPatch: Enter a supported match so the client can report its patch.
        restoreLiveData: Keep the League client and game running, wait for the local endpoint to recover, and rerun Diagnostics.
        enterGameForLiveData: Enter a supported match and wait for the local Live Client Data endpoint to become healthy.
        checkSpeechRuntime: Repair local speech support, then rerun the voice probe and TTS test.
        installLocalVoice: Install a local system voice and select it in Voice Settings.
        selectAvailableVoice: Select a voice that is currently listed in Voice Settings.
        checkAudioDevices: Connect or enable an output device, then rerun the audio probe.
        connectAudioOutput: Connect or enable a local audio output device.
        selectAvailableAudioOutput: Select an output device that is currently connected.
        configureShortcuts: Native support is available; configure the shortcuts you want before a live match.
        restartElevated: Restart League Akari as administrator if you choose to use native global shortcuts.
